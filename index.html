<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Naka Sky Hop</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2e;--ink:#f4f1ec;--mute:#9a9aa2;--or:#ff9f1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.35 ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:relative;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;display:block;background:#0b0b0c;border-radius:14px}
.panel{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;background:rgba(11,11,12,.88);border-radius:14px;text-align:center}
.panel.on{display:flex}
h1{margin:0;font-size:34px;letter-spacing:-.5px}
h1 span{color:var(--or)}
p{margin:0;color:var(--mute);font-weight:500}
input{width:100%;max-width:260px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:center}
button{padding:13px 30px;border:0;border-radius:12px;background:var(--or);color:#1a1000;font:inherit;font-weight:800;cursor:pointer}
ol{margin:4px 0 0;padding:0;list-style:none;width:100%;max-width:280px;text-align:left;font-weight:500}
li{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--line)}
li b{color:var(--or)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
#err{color:#ff6b6b;min-height:1.2em;font-size:14px}
</style></head><body>
<div id="wrap"><div id="stage"><canvas id="c" width="360" height="640"></canvas>
<div id="powerHud" style="position:absolute;top:42px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px;font-weight:900;text-shadow:0 2px 4px #000">
<span id="comboHud" style="color:#ffcf5a"></span><span id="boostHud" style="color:#7dffdc"></span><span id="shieldHud" style="color:#9cc7ff"></span>
</div>
<div class="panel on" id="menu">
<h1>Naka <span>Sky Hop</span></h1>
<p>Hop up the platforms. Grab rainbow gems. Don't fall.</p>
<input id="handle" maxlength="16" placeholder="Your X handle (optional)" autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="err"></div>
<button id="go">Start hopping</button>
<button id="lbBtn" class="ghost">Leaderboard</button>
<p>Hold the left or right side of the screen to steer. Leave the handle empty to hop as a guest.</p>
</div>
<div class="panel" id="over">
<h1 id="final"></h1><p id="sub"></p>
<button id="again">Hop again</button>
<button id="share" class="ghost">Share score</button>
<p id="note"></p><ol id="board"></ol>
</div><div class="panel" id="lb"><h1>Leaderboard</h1><p id="lbNote"></p><ol id="lbBoard"></ol><button id="lbBack">Back</button></div>
</div></div>

const $=id=>document.getElementById(id);
const PW=52,PH=128,DW=54;
let token=null,elapsed=0;
let st='menu',P,plats,gems,powerups,score,gemCount,keys={},hold=0,last=0,handle='';
let combo=0,mult=1,boost=0,shield=0,bestCombo=0,personalBest=0,pickupFlash=0;

function addPlat(y){
  const lvl=Math.min(1,score/6000),r=Math.random();
  let t=0;if(r<.18+lvl*.12)t=1;else if(r<.3+lvl*.25)t=2;
  const prev=plats.reduce((a,b)=>b.y<a.y?b:a,plats[0]);if(t===2&&prev&&prev.t===2)t=0;
  const p={x:rnd(0,W-92),y,w:92,t,dir:Math.random()<.5?-1:1,spring:t===0&&Math.random()<.08,dead:0};
  plats.push(p);
  if(t!==2&&Math.random()<.28)gems.push({x:p.x+p.w/2,y:y-26,p});
  if(t!==2&&Math.random()<.075)powerups.push({x:p.x+p.w/2,y:y-30,p,type:Math.random()<.58?'boost':'shield',on:1});
  return p;
}
function reset(){
  score=0;gemCount=0;plats=[];gems=[];powerups=[];
  combo=0;mult=1;boost=0;shield=0;bestCombo=0;pickupFlash=0;
  P={x:W/2-PW/2,y:H-60-PH-4,vx:0,vy:-13.8,face:1};
  plats.push({x:W/2-46,y:H-60,w:92,t:0,dir:1,spring:false,dead:0});
  let y=H-60;while(y>-40){y-=rnd(65,105);addPlat(y)}
}
function topY(){return Math.min(...plats.map(p=>p.y))}
function step(dt){
  elapsed+=dt*16.67/1000;
  const ax=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)+hold;
  P.vx+=(ax*5.2-P.vx)*.22*dt;if(ax)P.face=ax>0?1:-1;
  P.x+=P.vx*dt;if(P.x<-PW/2)P.x=W-PW/2;if(P.x>W-PW/2)P.x=-PW/2;
  const py=P.y+PH;P.vy+=.42*dt;P.y+=P.vy*dt;
  for(const p of plats){
    if(p.t===1){p.x+=p.dir*1.4*dt;if(p.x<0||p.x>W-p.w)p.dir*=-1}
    if(p.dead)p.y+=6*dt;
  }
  if(P.vy>0)for(const p of plats){
    if(p.dead)continue;
    if(py<=p.y+4&&P.y+PH>=p.y&&P.x+PW*.85>p.x&&P.x+PW*.15<p.x+p.w){
      if(p.t===2){p.dead=1;continue}
      P.vy=p.spring?-22:-13.8;break;
    }
  }
  boost=Math.max(0,boost-dt);
  pickupFlash=Math.max(0,pickupFlash-dt);
  gems=gems.filter(q=>{
    if(q.p.t===1)q.x=q.p.x+q.p.w/2;if(q.p.dead)q.y+=6*dt;
    if(Math.abs(P.x+PW/2-q.x)<PW/2+14&&Math.abs(P.y+PH/2-q.y)<PH/2+14){
      gemCount++;combo++;bestCombo=Math.max(bestCombo,combo);
      mult=Math.min(5,1+Math.floor(combo/3));
      score+=50*mult*(boost>0?2:1);pickupFlash=18;return false
    }
    return true;
  });
  powerups=powerups.filter(q=>{
    if(q.p.t===1)q.x=q.p.x+q.p.w/2;if(q.p.dead)q.y+=6*dt;
    if(Math.abs(P.x+PW/2-q.x)<PW/2+16&&Math.abs(P.y+PH/2-q.y)<PH/2+16){
      if(q.type==='boost'){boost=480;score+=100}
      else shield=1;
      pickupFlash=24;return false
    }
    return true;
  });
  if(P.vy>0&&P.y>H*.72)combo=0,mult=1;
  if(P.y<H*.4){const d=H*.4-P.y;P.y=H*.4;score+=d;
    plats.forEach(p=>p.y+=d);gems.forEach(q=>q.y+=d)}
  plats=plats.filter(p=>p.y<H+40);gems=gems.filter(q=>q.y<H+40);powerups=powerups.filter(q=>q.y<H+40);
  while(topY()>-20)addPlat(topY()-rnd(70,82+Math.min(70,score/60)));
  if(P.y>H+20){
    if(shield){shield=0;P.y=H-PH-8;P.vy=-19;P.vx*=.45;score+=150;combo=0;mult=1;pickupFlash=30}
    else end();
  }
}
function draw(){
  g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#14101f');gr.addColorStop(1,'#0b0b0c');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,159,28,.35)';
  for(let i=0;i<22;i++){const sy=((i*97+score*.15*(1+i%3*.4))%H);g.fillRect((i*53)%W,sy,2,2)}
  for(const p of plats){
    g.globalAlpha=p.dead?.4:1;
    g.fillStyle=p.t===1?'#7b4dff':p.t===2?'#8a5a2b':'#ff9f1c';
    g.beginPath();g.roundRect(p.x,p.y,p.w,12,6);g.fill();
    if(p.t===2){g.strokeStyle='#0b0b0c';g.lineWidth=2;g.beginPath();g.moveTo(p.x+p.w/2-3,p.y);g.lineTo(p.x+p.w/2+3,p.y+12);g.stroke()}
    if(p.spring){g.fillStyle='#3ddc84';g.fillRect(p.x+p.w/2-8,p.y-9,16,9)}
  }
  g.globalAlpha=1;
  for(const q of powerups){
    const pulse=1+Math.sin(performance.now()/130)*.12;
    g.save();g.translate(q.x,q.y);g.scale(pulse,pulse);
    g.shadowBlur=16;g.shadowColor=q.type==='boost'?'#ffd34d':'#55aaff';
    g.fillStyle=q.type==='boost'?'#ffd34d':'#55aaff';
    g.beginPath();g.arc(0,0,12,0,Math.PI*2);g.fill();
    g.shadowBlur=0;g.fillStyle='#17121c';g.font='900 13px system-ui';g.textAlign='center';g.textBaseline='middle';
    g.fillText(q.type==='boost'?'2×':'✦',0,1);g.restore();
  }
  const t=performance.now()/400;
  for(const q of gems){
    const gg=g.createLinearGradient(q.x-9,q.y,q.x+9,q.y);
    ['#ff2d55','#ff9f1c','#3ddc84','#2d7bff','#b14dff'].forEach((c,i)=>gg.addColorStop(i/4,c));
    g.fillStyle=gg;g.beginPath();g.moveTo(q.x,q.y-11+Math.sin(t)*2);g.lineTo(q.x+9,q.y);g.lineTo(q.x,q.y+11);g.lineTo(q.x-9,q.y);g.fill();
  }
  g.imageSmoothingEnabled=false;g.save();g.translate(P.x+PW/2,P.y+PH/2);g.scale(P.face,1);
  g.rotate(Math.max(-.12,Math.min(.12,P.vy*.008)));
  g.shadowColor='rgba(255,159,28,.55)';g.shadowBlur=14;
  if(img.complete)g.drawImage(img,-DW/2,-PH/2,DW,PH);g.restore();
  g.fillStyle='#f4f1ec';g.font='800 22px ui-rounded,system-ui,sans-serif';g.textAlign='left';
  g.fillText(Math.floor(score),14,32);
  g.fillStyle='#ff9f1c';g.textAlign='right';g.fillText('◆ '+gemCount,W-14,32);
  $('comboHud').textContent=combo>=3?'COMBO ×'+mult:'';
  $('boostHud').textContent=boost>0?'2× BOOST':'';
  $('shieldHud').textContent=shield?'✦ SHIELD READY':'';
  if(pickupFlash>0){g.fillStyle='rgba(255,207,90,'+(Math.min(.35,pickupFlash/70))+')';g.fillRect(0,0,W,H)}
}
function loop(ts){
  const dt=Math.min(2,(ts-last)/16.67||1);last=ts;
  if(st==='play')step(dt);
  draw();requestAnimationFrame(loop);
}
const cleanH=v=>v.replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,'').slice(0,15);
async function api(path,opt){const r=await fetch('/api'+path,{cache:'no-store',...opt});if(!r.ok)throw new Error(r.status);return r.json()}
function localBoard(){try{return JSON.parse(store.get(LS))||[]}catch{return[]}}
function saveLocal(h,s){const b=localBoard(),e=b.find(x=>x.handle.toLowerCase()==h.toLowerCase());

  handle=cleanH($('handle').value);store.set(LH,handle);$('err').textContent='';
  personalBest=Number(store.get('nakahop_best')||0);
  elapsed=0;token=null;
  if(location.protocol.startsWith('http'))api('/start').then(j=>{token=j.token}).catch(()=>{});
  reset();st='play';['menu','over','lb'].forEach(id=>$(id).classList.remove('on'));
}
async function end(){
  st='over';const s=Math.floor(score),g=gemCount,tm=+elapsed.toFixed(2),tk=token;
  personalBest=Math.max(personalBest,s);store.set('nakahop_best',String(personalBest));token=null;
  $('final').textContent=s+' points';$('sub').textContent=(handle?'@'+handle:'Guest')+' · '+g+' gems · best '+personalBest+' · best combo ×'+(bestCombo?Math.min(5,1+Math.floor(bestCombo/3)):1);
  $('note').textContent='Saving score…';$('board').replaceChildren();$('over').classList.add('on');
  if(handle&&s>0)saveLocal(handle,s);
  let res=null;
  if(handle&&tk&&s>0){try{res=await api('/hop-score',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({handle,score:s,gems:g,time:tm,t:tm,token:tk})})}catch{}}
  let list,msg;
  if(res){list=res.top;msg='Global leaderboard · you are #'+res.rank+' as @'+handle.toLowerCase()}
  else{const b=await getBoard();list=b.list;msg=b.global?'Global leaderboard':'Top hoppers on this device'+(handle?'':' · add an X handle to join the board')}
  $('note').textContent=msg;render($('board'),list,handle);
}
$('lbBtn').onclick=async()=>{
  ['menu','over'].forEach(id=>$(id).classList.remove('on'));$('lb').classList.add('on');
  $('lbNote').textContent='Loading leaderboard…';$('lbBoard').replaceChildren();
  const b=await getBoard();$('lbNote').textContent=b.global?'Global leaderboard':'Top hoppers on this device';render($('lbBoard'),b.list||[],handle);
};
$('share').onclick=async()=>{
  const s=Math.floor(score),url=location.href;
  const msg='I scored '+s+' points and collected '+gemCount+' gems in Naka Sky Hop! Can you beat me? 🚀 '+url+' #NakaSkyHop #ShieldedNaka #SHNAKAS';
  const intent='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg);
  try{if(navigator.share)await navigator.share({text:msg,url});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);$('note').textContent='Score post copied! Paste it on X.'}else window.open(intent,'_blank','noopener')}
  catch(e){if(e.name!=='AbortError')window.open(intent,'_blank','noopener')}
};
$('lbBack').onclick=()=>{$('lb').classList.remove('on');$('menu').classList.add('on')};
$('handle').addEventListener('input',e=>{e.target.value=cleanH(e.target.value)});
$('go').onclick=start;$('again').onclick=start;
$('handle').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
addEventListener('keydown',e=>{if(document.activeElement.tagName!=='INPUT')keys[e.key]=1});
addEventListener('keyup',e=>keys[e.key]=0);
const side=e=>{if(st!=='play')return;const r=cv.getBoundingClientRect();hold=(e.clientX-r.left)<r.width/2?-1:1};
cv.addEventListener('pointerdown',side);cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')side(e)});
addEventListener('pointerup',()=>hold=0);addEventListener('pointercancel',()=>hold=0);
reset();requestAnimationFrame(loop);
</script></body></html>
